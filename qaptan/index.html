      </div>
      <p class="form-err" id="pinErr"></p>
      <button class="btn btn-primary" data-act="a-pin">${ic('lock')} تغيير الرقم السري</button></div>

    <div class="card-block"><h3>إعادة الضبط التلقائية</h3><p class="muted">بعد هذي المدة بدون لمس، ترجع الشاشة للرئيسية وتنفضّي المفضلة والفلاتر للزبونة الجاية.</p>
      <div class="chips">${[1, 2, 3, 5].map(n => `<button class="chip" data-act="a-idle" data-min="${n}" aria-pressed="${st.idleMinutes === n}">${n === 1 ? 'دقيقة' : n === 2 ? 'دقيقتين' : `${n} دقائق`}</button>`).join('')}</div></div>

    <div class="card-block"><h3>التطبيق على التابلت</h3><p class="muted">ثبّتي قبطان على الشاشة الرئيسية عشان يفتح بملء الشاشة ويشتغل بدون إنترنت.</p>
      <div class="btn-row">${install}
        <button class="btn btn-outline" data-act="a-fullscreen">${ic('expand')} ملء الشاشة</button></div>
      <p class="hint" style="margin-top:12px">نصيحة: فعّلي «الوصول الموجّه» في الآيباد أو «تثبيت الشاشة» في أندرويد عشان تبقى الزبونة داخل التطبيق.</p></div>

    <div class="card-block"><h3>التخزين</h3>
      <dl class="kv" id="storageInfo"><dt>المساحة المستخدمة</dt><dd>…</dd></dl>
      <div class="btn-row" style="margin-top:14px"><button class="btn btn-outline" data-act="a-persist">${ic('hdd')} طلب تخزين دائم</button></div>
      <p class="hint" style="margin-top:10px">التخزين الدائم يقلل احتمال أن يحذف المتصفح البيانات تلقائياً. مع ذلك صدّري نسخة احتياطية بشكل دوري.</p></div>

    <div class="card-block danger-zone"><h3>البيانات</h3><p class="muted">إجراءات لا يمكن التراجع عنها — صدّري نسخة احتياطية قبلها.</p>
      <div class="btn-row">
        ${demoCount ? `<button class="btn btn-danger-outline" data-act="a-del-demo">${ic('trash')} حذف العبايات التجريبية (${demoCount})</button>` : ''}
        <button class="btn btn-danger" data-act="a-reset">${ic('refresh')} إعادة ضبط كامل</button></div></div>

    <p class="hint" style="text-align:center">قبطان — الإصدار ${APP_VERSION}</p>`;
}

async function fillStorageInfo() {
  const el = $('#storageInfo'); if (!el) return;
  let used = '—', persisted = 'غير معروف';
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const e = await navigator.storage.estimate();
      used = `${(e.usage / 1048576).toFixed(1)} م.ب${e.quota ? ` من ${(e.quota / 1048576 / 1024).toFixed(1)} ج.ب متاحة` : ''}`;
    }
    if (navigator.storage && navigator.storage.persisted) persisted = (await navigator.storage.persisted()) ? 'مفعّل ✓' : 'غير مفعّل';
  } catch (e) { /* تجاهل */ }
  if (!$('#storageInfo')) return;
  el.innerHTML = `<dt>المساحة المستخدمة</dt><dd>${used}</dd><dt>التخزين الدائم</dt><dd>${persisted}</dd>`;
}
async function requestPersistentStorage(verbose = false) {
  try {
    if (navigator.storage && navigator.storage.persist) {
      const ok = await navigator.storage.persist();
      if (verbose) toast(ok ? 'تم تفعيل التخزين الدائم' : 'المتصفح رفض الطلب حالياً (يتفعل غالباً بعد تثبيت التطبيق)');
      return ok;
    }
  } catch (e) { /* تجاهل */ }
  if (verbose) toast('المتصفح لا يدعم هذي الميزة');
  return false;
}

function changePin() {
  const old = $('#pinOld').value.trim(), n1 = norm($('#pinNew').value), n2 = norm($('#pinNew2').value);
  const err = $('#pinErr');
  if (norm(old) !== state.settings.pin) { err.textContent = 'الرقم الحالي غير صحيح'; return; }
  if (!/^\d{4,8}$/.test(n1)) { err.textContent = 'الرقم الجديد لازم يكون من ٤ إلى ٨ أرقام'; return; }
  if (n1 !== n2) { err.textContent = 'التأكيد لا يطابق الرقم الجديد'; return; }
  state.settings.pin = n1; saveSettings(); markChanged();
  ['#pinOld', '#pinNew', '#pinNew2'].forEach(s => $(s).value = '');
  err.textContent = '';
  toast('تم تغيير الرقم السري');
}

async function deleteDemo() {
  const demos = state.abayas.filter(a => a.demo);
  if (!demos.length) return;
  if (!await confirmDialog({ title: 'حذف العبايات التجريبية؟', text: `بتنحذف ${countLabel(demos.length, ABAYA_FORMS)} تجريبية. العبايات اللي عدّلتيها أو أضفتيها بنفسك ما تنحذف.`, ok: 'حذف', danger: true, icon: 'trash' })) return;
  for (const a of demos) if (a.image) { await ImageDB.del(a.image); dropImageURL(a.image); }
  state.abayas = state.abayas.filter(a => !a.demo);
  saveAbayas(); markChanged(); refreshFacets();
  renderAdminTab();
  toast('تم حذف العبايات التجريبية');
}

async function fullReset() {
  if (!await confirmDialog({ title: 'إعادة ضبط كامل؟', text: 'بتنحذف كل العبايات والصور والتصميم، والرقم السري يرجع 1234، وترجع البيانات التجريبية.', ok: 'متابعة', danger: true })) return;
  if (!await confirmDialog({ title: 'متأكدة؟', text: 'هذا الإجراء نهائي ولا يمكن التراجع عنه.', ok: 'نعم، احذفي كل شيء', danger: true, icon: 'trash' })) return;
  Object.values(KEYS).forEach(k => Store.remove(k));
  await ImageDB.clear(); clearImageURLs(); phCache.clear();
  loadState();
  applyTheme(); applyFonts();
  closeAdmin(); resetSession();
  toast('تمت إعادة الضبط الكاملة');
}

/* =====================================================================
   ١٢) ربط الأحداث (تفويض واحد لكل الضغطات)
   ===================================================================== */
const ACTIONS = {
  /* الزبونة */
  'home': () => navigateHome(),
  'favs': () => { if (state.view !== 'favs') navigate('favs'); else closeFilters(); },
  'filters': () => state.sheetOpen ? closeFilters() : openFilters(),
  'close-filters': () => closeFilters(),
  'open': (el) => navigate('detail', el.dataset.id),
  'fav': (el) => toggleFav(el.dataset.id, el),
  'back': () => goBack(),
  'toggle-filter': (el) => toggleFilter(el.dataset.group, el.dataset.value),
  'remove-filter': (el) => removeFilter(el.dataset.group, el.dataset.value),
  'clear-filters': () => clearFilters(),
  'clear-search': () => { state.search = ''; const i = $('#searchInput'); if (i) i.value = ''; updateResults(); },
  'sort': (el) => { state.sort = el.dataset.sort; updateResults(); },
  'pick-size': (el) => pickSize(el.dataset.size),
  'pick-color': (el) => pickColor(el.dataset.color),
  'request': (el) => openRequest(el.dataset.id),
  'request-all': () => openRequestAll(),
  'fav-size': (el) => {
    const fe = favEntry(el.dataset.id); if (!fe) return;
    const s = Number(el.dataset.size); fe.size = fe.size === s ? null : s;
    $$(`#view-favs [data-act="fav-size"][data-id="${CSS.escape(el.dataset.id)}"]`).forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.size) === fe.size)));
  },
  'zoom': () => openZoom(),
  /* وضع التعديل */
  'a-exit': () => { closeAdmin(); resetSession(); toast('تم الخروج من وضع التعديل'); },
  'a-tab': (el) => { adm.tab = el.dataset.tab; renderAdmin(); },
  'a-new': () => openEditor(null),
  'a-edit': (el) => openEditor(el.dataset.id),
  'a-del': (el) => deleteAbaya(el.dataset.id),
  'a-avail': (el) => toggleAvailability(el.dataset.id),
  'a-preset': (el) => {
    state.settings.theme = { ...THEME_PRESETS[Number(el.dataset.i)].t };
    applyTheme(); saveSettings(); markChanged(); renderAdminTab();
  },
  'a-font': (el) => {
    state.settings[el.dataset.kind] = el.dataset.font;
    applyFonts(); saveSettings(); markChanged();
    $$(`[data-act="a-font"][data-kind="${el.dataset.kind}"]`).forEach(b => b.setAttribute('aria-pressed', String(b === el)));
  },
  'a-logo-rm': async () => {
    const old = state.settings.logo; if (!old) return;
    await ImageDB.del(old); dropImageURL(old);
    state.settings.logo = null; saveSettings(); markChanged(); renderBrand(); renderAdminTab();
  },
  'a-design-reset': async () => {
    if (!await confirmDialog({ title: 'استرجاع التصميم الافتراضي؟', text: 'ترجع الألوان والخطوط للوضع الأصلي. الاسم والشعار ونص الترحيب ما تتغير.', ok: 'استرجاع' })) return;
    state.settings.theme = { ...DEFAULT_THEME };
    state.settings.headFont = DEFAULT_SETTINGS.headFont; state.settings.bodyFont = DEFAULT_SETTINGS.bodyFont;
    applyTheme(); applyFonts(); saveSettings(); markChanged(); renderAdminTab();
  },
  'a-export': () => exportBackup(false),
  'a-share': () => exportBackup(true),
  'a-pin': () => changePin(),
  'a-idle': (el) => {
    state.settings.idleMinutes = Number(el.dataset.min); saveSettings();
    $$('[data-act="a-idle"]').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
    toast('تم الحفظ');
  },
  'a-install': async () => {
    if (!deferredInstall) return;
    try { deferredInstall.prompt(); await deferredInstall.userChoice; } catch (e) { /* تجاهل */ }
    deferredInstall = null; renderAdminTab();
  },
  'a-fullscreen': () => {
    try {
      const d = document, el = d.documentElement;
      if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      else if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else toast('ملء الشاشة غير مدعوم هنا، ثبّتي التطبيق بدلاً منه');
    } catch (e) { toast('ملء الشاشة غير مدعوم هنا'); }
  },
  'a-persist': async () => { await requestPersistentStorage(true); fillStorageInfo(); },
  'a-del-demo': () => deleteDemo(),
  'a-reset': () => fullReset(),
};

function bindEvents() {
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACTIONS[el.dataset.act];
    if (!fn) return;
    // لا تنفذ أوامر الزبونة إذا كانت فوقها نافذة منبثقة أو وضع التعديل
    if (!el.dataset.act.startsWith('a-') && (adminOpen() && !el.closest('#admin'))) return;
    fn(el, e);
  });
  // تفعيل البطاقات بلوحة المفاتيح أيضاً
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (modals.length) { const m = topModal(); if (m && m !== idleModal) m.close(); }
      else if (state.sheetOpen) closeFilters();
      return;
    }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.card[data-act]')) { e.preventDefault(); e.target.click(); }
  });
  // البحث
  const onSearch = debounce((v) => { state.search = v; updateResults(); }, 140);
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'searchInput') onSearch(t.value);
    else if (t.id === 'aSearch') { adm.q = t.value; const list = $('#aList'); if (list) { const pos = t.selectionStart; renderAdminTab(); const n = $('#aSearch'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) { /* تجاهل */ } } } }
    else if (t.dataset && t.dataset.bind) onBind(t);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'searchInput') e.target.blur(); });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'aLogoFile') { onLogoFile(t.files && t.files[0]); t.value = ''; }
    else if (t.id === 'aImportFile') { importBackup(t.files && t.files[0]); t.value = ''; }
  });
  // الضغطة الطويلة على الشعار لفتح وضع التعديل
  bindLongPress($('#brandBtn'), LONG_PRESS_MS, requestAdmin);
  // رصد النشاط لإعادة الضبط التلقائية
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => document.addEventListener(ev, markActivity, { capture: true, passive: true }));
  window.addEventListener('scroll', () => { lastActivity = Date.now(); }, { passive: true });
  setInterval(idleTick, 1000);
  // تحديث التخطيط عند تدوير الشاشة
  window.addEventListener('resize', debounce(() => { if (wideLayout() && state.sheetOpen) closeFilters(); paintRange(); }, 150));
  document.addEventListener('contextmenu', (e) => { if (!e.target.closest('input,textarea')) e.preventDefault(); });
}

function bindLongPress(el, ms, onLong) {
  let timer = null, fired = false;
  const cancel = () => { clearTimeout(timer); timer = null; el.classList.remove('pressing'); };
  el.addEventListener('pointerdown', (e) => {
    if (e.button > 0) return;
    fired = false; el.classList.add('pressing');
    timer = setTimeout(() => {
      fired = true; el.classList.remove('pressing');
      try { navigator.vibrate && navigator.vibrate(40); } catch (er) { /* تجاهل */ }
      onLong();
    }, ms);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, cancel));
  el.addEventListener('click', (e) => { if (fired) { e.preventDefault(); e.stopPropagation(); fired = false; } }, true);
}

/* =====================================================================
   ١٣) تطبيق الويب التقدمي: العامل الخدمي والتثبيت
   ===================================================================== */
function registerSW() {
  try {
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('./sw.js').catch(e => console.warn('تعذر تسجيل العامل الخدمي', e));
    }
  } catch (e) { /* تجاهل */ }
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();   // لا نعرض شريط التثبيت للزبونات؛ التثبيت من وضع التعديل
  deferredInstall = e;
});
window.addEventListener('appinstalled', () => { deferredInstall = null; requestPersistentStorage(); });

/* =====================================================================
   ١٤) التشغيل
   ===================================================================== */
async function boot() {
  try {
    loadState();
    applyTheme(); applyFonts();
    $('#splashLogo').innerHTML = emblemSVG(110);
    await preloadImages();
    renderBrand();
    renderHome();
    showView('home', 0);
    bindEvents();
    registerSW();
    cleanupOrphanImages();
    try { document.documentElement.style.setProperty('--topbar-h', $('#topbar').offsetHeight + 'px'); } catch (e) { /* تجاهل */ }
  } catch (e) {
    console.error(e);
    document.body.insertAdjacentHTML('beforeend', `<div class="empty" style="margin:40px">${EMPTY_ART.hanger}<h3>صار خطأ أثناء التشغيل</h3><p>أعيدي تحميل الصفحة. إذا تكرر الخطأ استوردي آخر نسخة احتياطية.</p><div class="empty-actions"><button class="btn btn-primary" onclick="location.reload()">إعادة التحميل</button></div></div>`);
  } finally {
    setTimeout(() => $('#splash').classList.add('gone'), 250);
    setTimeout(() => $('#splash').remove(), 900);
  }
}

// للاختبار والتشخيص فقط
window.Qaptan = { state, resetSession, version: APP_VERSION };

boot();
})();
</script>
