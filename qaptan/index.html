<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>قبطان — كتالوج العبايات</title>
<meta name="description" content="قبطان: كتالوج عبايات ذكي على شاشة لمس داخل المحل، تتصفح فيه الزبونة العبايات بنفسها.">
<meta name="theme-color" content="#F7EBDD">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="قبطان">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* =====================================================================
   ١) متغيرات التصميم (تُعاد كتابتها من وضع التعديل)
   ===================================================================== */
:root{
  --bg:#F7EBDD; --surface:#FCF6EF; --surface-2:#EFE2D3; --glass:rgba(247,235,221,.88);
  --ink:#2B1D16; --ink-soft:#6A5444; --ink-faint:#9C8574; --on-ink:#F7EBDD;
  --caramel:#C08A5B; --terracotta:#B5603F; --gold:#C6A15B; --on-accent:#FFFFFF;
  --line:rgba(43,29,22,.12); --line-strong:rgba(43,29,22,.22); --shadow-c:rgba(43,29,22,.20);
  --font-head:'Amiri','Noto Naskh Arabic','Geeza Pro','Times New Roman',serif;
  --font-body:'Tajawal','Noto Sans Arabic','Geeza Pro',Tahoma,Arial,sans-serif;
  --r-xl:34px; --r-lg:26px; --r-md:18px; --r-sm:14px;
  --gutter:clamp(16px,3vw,34px);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --topbar-h:84px;
}

/* =====================================================================
   ٢) الأساسيات
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:17px;line-height:1.65;
  overscroll-behavior-y:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-font-smoothing:antialiased;
}
body.lock-scroll{overflow:hidden}
input,textarea,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
img{display:block;max-width:100%;-webkit-user-drag:none}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:700;margin:0;line-height:1.3}
p{margin:0}
[hidden]{display:none!important}
:focus{outline:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.ic{width:24px;height:24px;flex:none}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-soft)}
.gold-rule{height:1px;border:0;margin:22px 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

/* ---------- الأزرار ---------- */
.btn{
  min-height:56px;padding:0 26px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;
  gap:10px;font-weight:700;font-size:1.02rem;white-space:nowrap;transition:transform .12s ease,background .2s,opacity .2s;
}
.btn:active{transform:scale(.97)}
.btn .ic{width:22px;height:22px}
.btn-primary{background:var(--ink);color:var(--on-ink);box-shadow:0 12px 26px -14px var(--shadow-c)}
.btn-accent{background:var(--terracotta);color:var(--on-accent)}
.btn-outline{background:var(--surface);color:var(--ink);border:1.5px solid var(--line-strong)}
.btn-ghost{color:var(--ink-soft)}
.btn-danger{background:#A3392A;color:#fff}
.btn-danger-outline{border:1.5px solid rgba(163,57,42,.45);color:#A3392A;background:var(--surface)}
.btn-lg{min-height:68px;padding:0 36px;font-size:1.18rem}
.btn-sm{min-height:48px;padding:0 18px;font-size:.95rem}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{
  width:52px;height:52px;border-radius:50%;display:inline-grid;place-items:center;flex:none;
  background:var(--surface);border:1.5px solid var(--line);color:var(--ink);transition:transform .12s;
}
.icon-btn:active{transform:scale(.92)}
.icon-btn.danger{color:#A3392A}
.link-btn{min-height:48px;padding:0 12px;color:var(--terracotta);font-weight:700;text-decoration:underline;text-underline-offset:5px}

/* ---------- الكبسولات (الفلاتر والاختيارات) ---------- */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{
  min-height:48px;padding:0 18px;border-radius:999px;display:inline-flex;align-items:center;gap:10px;
  background:var(--surface);border:1.5px solid var(--line-strong);font-weight:500;transition:background .15s,color .15s,border-color .15s,transform .12s;
}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chip .sw{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.14),0 0 0 2px var(--surface)}
.chip[aria-pressed="true"] .sw{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25),0 0 0 2px var(--ink)}
.chip-n{font-size:.78rem;opacity:.6;font-weight:700}
.chip-x{padding-inline-end:10px}
.chip-x .ic{width:20px;height:20px;opacity:.7}

/* ---------- مفتاح التشغيل ---------- */
.switch{width:68px;height:40px;border-radius:999px;background:var(--line-strong);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:right .2s}
.switch[aria-checked="true"]{background:#5B7B4E}
.switch[aria-checked="true"]::after{right:32px}
.switch-wrap{display:flex;align-items:center;gap:12px;min-height:48px}

/* =====================================================================
   ٣) شاشة البداية والشريط العلوي
   ===================================================================== */
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;transition:opacity .45s}
#splash.gone{opacity:0;pointer-events:none}
#splash .logo{width:110px;height:110px;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}

.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:calc(12px + var(--safe-t)) var(--gutter) 12px;background:var(--glass);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:14px;min-height:60px;touch-action:none;text-align:start}
.brand .logo-wrap{position:relative;width:60px;height:60px;flex:none}
.logo{width:60px;height:60px;border-radius:50%;display:block;object-fit:cover}
.press-ring{position:absolute;inset:-6px;width:72px;height:72px;transform:rotate(-90deg);pointer-events:none}
.press-ring circle{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-dasharray:207;stroke-dashoffset:207;opacity:0}
.brand.pressing .press-ring circle{opacity:1;stroke-dashoffset:0;transition:stroke-dashoffset 2.4s linear .6s,opacity .2s .6s}
.brand-name{font-family:var(--font-head);font-size:1.75rem;font-weight:700;line-height:1.1;display:block}
.brand-tag{font-size:.88rem;color:var(--ink-soft);display:block;margin-top:2px}
.top-pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft);font-size:.92rem;background:var(--surface)}
.top-pill .ic{width:20px;height:20px;color:var(--gold)}

/* =====================================================================
   ٤) الصفحات العامة
   ===================================================================== */
main{padding:0 var(--gutter) calc(130px + var(--safe-b))}
.view{animation:viewIn .3s ease}
@keyframes viewIn{from{opacity:0}to{opacity:1}}

/* ---------- البانر الترحيبي ---------- */
.banner{
  position:relative;overflow:hidden;margin-top:22px;border-radius:var(--r-xl);background:var(--ink);color:var(--on-ink);
  display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:center;
  padding:clamp(26px,4vw,48px);min-height:230px;
}
.banner::before{content:"";position:absolute;inset:12px;border:1px solid var(--gold);border-radius:calc(var(--r-xl) - 10px);opacity:.45;pointer-events:none}
.banner-text{position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;letter-spacing:.3px;color:var(--gold);font-weight:700}
.eyebrow .ic{width:18px;height:18px}
.banner h1{font-size:clamp(2rem,4.2vw,3.1rem);margin:8px 0 10px}
.banner p{opacity:.85;max-width:44ch;font-size:1.06rem}
.banner-stats{display:flex;align-items:center;flex-wrap:wrap;gap:14px;margin-top:20px;font-size:.95rem;opacity:.9}
.banner-stats b{font-size:1.35rem;color:var(--gold);margin-inline-end:4px}
.banner-stats i{width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.6}
.banner-arches{position:relative;height:100%;min-height:200px;display:flex;justify-content:center;align-items:flex-end;gap:12px}
.arch{width:clamp(88px,11vw,130px);aspect-ratio:3/4.4;border-radius:999px 999px 18px 18px;overflow:hidden;border:1.5px solid var(--gold);background:var(--surface-2);box-shadow:0 18px 30px -16px rgba(0,0,0,.5)}
.arch img{width:100%;height:100%;object-fit:cover}
.arch.a1{transform:translateY(-22px);width:clamp(100px,12.5vw,150px)}
.home.filtering .banner{display:none}

/* ---------- شريط البحث والترتيب ---------- */
.toolbar{display:flex;gap:12px;align-items:center;margin-top:24px}
.search{position:relative;flex:1;min-width:0}
.search input{
  width:100%;height:62px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--surface);
  padding:0 58px 0 58px;font-size:1.08rem;transition:border-color .2s,box-shadow .2s;
}
.search input::placeholder{color:var(--ink-faint)}
.search input:focus{border-color:var(--caramel);box-shadow:0 0 0 4px rgba(192,138,91,.18)}
.search .s-ic{position:absolute;top:50%;right:20px;transform:translateY(-50%);color:var(--ink-soft);pointer-events:none}
.search .s-clear{position:absolute;top:50%;left:6px;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:var(--ink-soft)}
.search input::-webkit-search-cancel-button{display:none}
.filter-btn{position:relative;height:62px;padding:0 24px}
.count-badge{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--terracotta);color:var(--on-accent);font-size:.8rem;font-weight:800;display:inline-grid;place-items:center;line-height:1}
.active-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.active-row:empty{display:none}

/* ---------- تخطيط الرئيسية: فلاتر + نتائج ---------- */
.home-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;margin-top:22px;align-items:start}
.results-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.results-head h2{font-size:1.6rem}
.results-head .sub{color:var(--ink-soft);font-size:.98rem}
.sort{display:flex;gap:8px;flex-wrap:wrap}
.sort .chip{min-height:46px;font-size:.92rem;padding:0 16px}

/* ---------- لوحة الفلاتر (ورقة سفلية على الشاشات العمودية) ---------- */
.filters{
  position:fixed;left:0;right:0;bottom:0;z-index:70;max-height:88vh;max-height:88dvh;overflow:auto;overscroll-behavior:contain;
  background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:10px 26px calc(24px + var(--safe-b));
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 50px -20px rgba(0,0,0,.35);
}
.filters.open{transform:none}
.filters::before{content:"";display:block;width:56px;height:6px;border-radius:3px;background:var(--line-strong);margin:4px auto 12px}
.fp-backdrop{position:fixed;inset:0;z-index:65;background:rgba(28,18,12,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.fp-backdrop.show{opacity:1;pointer-events:auto}
.fp-head{display:flex;align-items:center;gap:12px;justify-content:space-between}
.fp-head h3{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.fp-head h3 .ic{color:var(--gold)}
.fp-head-actions{display:flex;align-items:center;gap:6px}
.fp-count{color:var(--ink-soft);margin-top:2px}
.fp-count b{color:var(--ink);font-size:1.15rem}
.fp-group{padding:20px 0;border-bottom:1px solid var(--line)}
.fp-group:last-of-type{border-bottom:0}
.fp-group h4{font-family:var(--font-body);font-size:1.02rem;font-weight:800;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.fp-group h4 small{font-weight:500;color:var(--ink-soft);font-size:.9rem}
.fp-foot{position:sticky;bottom:calc(-24px - var(--safe-b));display:flex;gap:12px;padding:16px 0 4px;background:var(--surface)}
.fp-foot .btn{flex:1}
.fp-empty{color:var(--ink-soft);padding:8px 0}

/* شريط نطاق السعر (مقبضين) */
.range{position:relative;height:52px;direction:ltr;margin:4px 0 6px}
.range-track{position:absolute;left:20px;right:20px;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--line-strong)}
.range-fill{position:absolute;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--caramel)}
.range input{position:absolute;inset:0;width:100%;height:52px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.range input::-webkit-slider-runnable-track{height:52px;background:transparent;border:0}
.range input::-moz-range-track{height:52px;background:transparent;border:0}
.range input::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;pointer-events:auto;width:40px;height:40px;margin-top:6px;border-radius:50%;
  background:var(--surface);border:3px solid var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.18);cursor:grab;
}
.range input::-moz-range-thumb{pointer-events:auto;width:34px;height:34px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.range-vals{display:flex;justify-content:space-between;gap:10px;font-size:.95rem;color:var(--ink-soft);direction:ltr}
.range-vals span{direction:rtl}
.range-vals b{color:var(--ink);font-size:1.05rem}

/* =====================================================================
   ٥) بطاقات العبايات
   ===================================================================== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:clamp(16px,2.2vw,26px)}
.card{
  position:relative;background:var(--surface);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;text-align:start;
  box-shadow:0 14px 30px -22px var(--shadow-c);border:1px solid var(--line);transition:transform .15s ease;
  animation:cardIn .4s ease both;animation-delay:calc(var(--i,0) * 35ms);
}
.card:active{transform:scale(.975)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card-media{position:relative;aspect-ratio:3/4;background:var(--surface-2);overflow:hidden}
.card-media img{width:100%;height:100%;object-fit:cover}
.card-body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:1.22rem;line-height:1.35}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}
.price{font-weight:800;font-size:1.12rem;white-space:nowrap}
.price small{font-size:.75em;font-weight:500;color:var(--ink-soft);margin-inline-start:3px}
.dots{display:flex;gap:5px}
.dot{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.card-fabric{font-size:.88rem;color:var(--ink-soft)}
.tag{position:absolute;bottom:12px;right:12px;padding:6px 12px;border-radius:999px;background:rgba(28,18,12,.62);color:#fff;font-size:.8rem;font-weight:700;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

/* قلب المفضلة */
.heart{
  position:absolute;top:12px;left:12px;z-index:2;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,251,246,.92);box-shadow:0 6px 16px -6px rgba(0,0,0,.3);color:var(--ink);transition:transform .15s;
}
.heart .ic{width:27px;height:27px}
.heart[aria-pressed="true"]{color:var(--terracotta)}
.heart[aria-pressed="true"] .ic path{fill:currentColor}
.heart.pop{animation:pop .4s ease}
@keyframes pop{40%{transform:scale(1.25)}}

/* =====================================================================
   ٦) الحالات الفارغة
   ===================================================================== */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:56px 20px;grid-column:1/-1;background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r-xl)}
.empty-art{width:150px;height:150px;margin-bottom:6px}
.empty h3{font-size:1.65rem}
.empty p{color:var(--ink-soft);max-width:46ch}
.empty-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px}

/* =====================================================================
   ٧) صفحة التفاصيل
   ===================================================================== */
.page-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 18px}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.detail-media{position:relative;border-radius:var(--r-xl);overflow:hidden;background:var(--surface-2);aspect-ratio:3/4;max-height:54vh;margin-inline:auto;width:100%;max-width:calc(54vh * .75)}
.detail-media > img{width:100%;height:100%;object-fit:cover}
.detail-media .heart{top:18px;left:18px;width:62px;height:62px}
.zoom-btn{position:absolute;bottom:16px;left:16px;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:rgba(255,251,246,.92);color:var(--ink)}
.detail-info .eyebrow{color:var(--terracotta)}
.detail-info h1{font-size:clamp(2.1rem,4vw,3rem);margin:6px 0 8px}
.detail-price{font-size:1.9rem;font-weight:800}
.detail-price small{font-size:.55em;color:var(--ink-soft);font-weight:500;margin-inline-start:4px}
.detail-desc{color:var(--ink-soft);font-size:1.08rem;margin-top:14px;max-width:60ch}
.spec{margin-top:24px}
.spec h4{font-family:var(--font-body);font-size:1rem;font-weight:800;margin-bottom:12px;display:flex;gap:8px;align-items:baseline}
.spec h4 span{font-weight:500;color:var(--ink-soft)}
.fabric-pill{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;background:var(--surface-2);font-weight:700}
.color-dots{display:flex;gap:12px;flex-wrap:wrap}
.cdot{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:2px solid transparent;transition:border-color .15s,transform .12s}
.cdot:active{transform:scale(.92)}
.cdot span{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.18)}
.cdot[aria-pressed="true"]{border-color:var(--ink)}
.sizes{display:flex;gap:10px;flex-wrap:wrap}
.size{min-width:66px;height:58px;padding:0 14px;border-radius:16px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:800;font-size:1.1rem;transition:background .15s,color .15s,transform .12s}
.size:active{transform:scale(.95)}
.size[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.size.sm{min-width:54px;height:48px;font-size:1rem;border-radius:14px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
/* زر الطلب يبقى ظاهر فوق شريط التنقل مهما نزلت الصفحة */
.cta-row{position:sticky;bottom:calc(98px + var(--safe-b));z-index:5;padding:10px;margin-inline:-10px;border-radius:44px;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.cta-row .btn-primary{flex:1 1 280px}
.unavail-note{margin-top:20px;padding:14px 18px;border-radius:var(--r-md);background:rgba(181,96,63,.12);color:var(--terracotta);font-weight:700}
.similar{margin-top:44px}
.similar h2{font-size:1.6rem;margin-bottom:16px}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,220px);gap:18px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .card{scroll-snap-align:start}

/* =====================================================================
   ٨) صفحة المفضلة
   ===================================================================== */
.page-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:22px 0 22px}
.page-head .titles{flex:1;min-width:200px}
.page-head h1{font-size:clamp(2rem,4vw,2.6rem)}
.page-head p{color:var(--ink-soft)}
.fav-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:18px}
.fav-row{display:flex;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;animation:cardIn .35s ease both}
.fav-thumb{width:130px;flex:none;aspect-ratio:3/4;border-radius:var(--r-md);overflow:hidden;background:var(--surface-2)}
.fav-thumb img{width:100%;height:100%;object-fit:cover}
.fav-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.fav-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.fav-top h3{font-size:1.3rem}
.fav-meta{color:var(--ink-soft);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fav-sizes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fav-sizes > span{font-weight:700;font-size:.92rem;margin-inline-end:4px}
.fav-actions{margin-top:auto;display:flex;gap:10px;flex-wrap:wrap}

/* =====================================================================
   ٩) شريط التنقل السفلي العائم
   ===================================================================== */
.bottom-nav{
  position:fixed;bottom:calc(18px + var(--safe-b));left:50%;transform:translateX(-50%);z-index:40;
  display:flex;gap:6px;padding:8px;border-radius:999px;background:var(--ink);border:1px solid rgba(198,161,91,.45);
  box-shadow:0 22px 44px -16px rgba(0,0,0,.5);
}
.nav-btn{position:relative;min-width:124px;height:62px;padding:0 22px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--on-ink);font-weight:700;opacity:.78;transition:background .2s,color .2s,opacity .2s}
.nav-btn.active{background:var(--on-ink);color:var(--ink);opacity:1}
.nav-btn .count-badge{position:absolute;top:6px;left:14px}
.nav-btn.bump .count-badge{animation:pop .45s ease}

/* =====================================================================
   ١٠) النوافذ المنبثقة
   ===================================================================== */
#modals{position:relative;z-index:80}
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));background:rgba(28,18,12,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .22s}
.overlay.show{opacity:1}
.modal{
  position:relative;width:100%;max-width:880px;max-height:100%;overflow:auto;overscroll-behavior:contain;
  background:var(--surface);border-radius:var(--r-xl);box-shadow:0 40px 80px -30px rgba(0,0,0,.55);
  transform:translateY(16px) scale(.98);transition:transform .25s cubic-bezier(.2,.8,.2,1);
}
.overlay.show .modal{transform:none}
.modal-sm{max-width:480px;padding:30px}
.modal-lg{max-width:1080px}
.modal-close{position:absolute;top:16px;left:16px;z-index:3}
.modal h2{font-size:1.9rem}

/* نافذة "اطلبي من الموظفة" */
.req{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);min-height:420px}
.req-media{background:var(--surface-2);min-height:100%}
.req-media img{width:100%;height:100%;object-fit:cover;max-height:80vh}
.req-body{padding:34px 34px 30px;display:flex;flex-direction:column;gap:16px}
.req-hint{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:var(--r-md);background:var(--ink);color:var(--on-ink);font-weight:800;font-size:1.12rem}
.req-hint .ic{width:30px;height:30px;color:var(--gold)}
.req-body .req-hint{margin-inline-end:52px}
.req-code{display:flex;flex-direction:column;align-items:flex-start;padding:16px 20px;border-radius:var(--r-md);border:1.5px dashed var(--gold);background:var(--bg)}
.req-code small,.req-loc small{color:var(--ink-soft);font-size:.9rem;font-weight:700}
.req-code b{font-size:clamp(2.2rem,5vw,3.2rem);letter-spacing:2px;line-height:1.1;direction:ltr}
.req-loc{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:var(--r-md);background:rgba(192,138,91,.16)}
.req-loc .ic{width:34px;height:34px;color:var(--terracotta)}
.req-loc b{display:block;font-size:1.45rem;line-height:1.3}
.req-rows{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:center}
.req-rows dt{color:var(--ink-soft);font-weight:700}
.req-rows dd{margin:0;font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.req-need{color:var(--terracotta);font-size:.95rem;font-weight:700}
.req-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.req-list li{display:flex;gap:16px;align-items:center;padding:12px;border-radius:var(--r-md);background:var(--bg);border:1px solid var(--line)}
.req-list .n{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:800;flex:none}
.req-list img{width:70px;aspect-ratio:3/4;object-fit:cover;border-radius:12px;flex:none}
.req-list .info{flex:1;min-width:0}
.req-list .info > b{font-family:var(--font-head);font-size:1.2rem}
.req-list .meta{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:4px;font-size:.98rem}
.code-tag{font-weight:800;font-size:1.15rem;letter-spacing:1px;direction:ltr;unicode-bidi:isolate}
.loc-tag{display:inline-flex;align-items:center;gap:4px;color:var(--terracotta);font-weight:800}
.loc-tag .ic{width:18px;height:18px}
.modal-pad{padding:30px 34px}
.modal-foot{display:flex;gap:12px;justify-content:flex-end;padding:0 34px 30px;flex-wrap:wrap}

/* عارض الصورة */
.overlay.viewer{background:rgba(15,10,7,.92)}
.viewer img{max-width:100%;max-height:calc(100dvh - 40px);border-radius:var(--r-lg);object-fit:contain}
.viewer .icon-btn{position:fixed;top:calc(20px + var(--safe-t));left:20px}

/* تأكيد */
.confirm{text-align:center}
.confirm .c-ic{width:70px;height:70px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:rgba(181,96,63,.14);color:var(--terracotta)}
.confirm .c-ic .ic{width:34px;height:34px}
.confirm h3{font-size:1.6rem;margin-bottom:8px}
.confirm p{color:var(--ink-soft)}
.confirm .actions{display:flex;gap:12px;margin-top:24px}
.confirm .actions .btn{flex:1}

/* لوحة الرقم السري */
.pin{text-align:center}
.pin-head .ic{width:40px;height:40px;color:var(--gold)}
.pin-head h3{font-size:1.6rem;margin-top:6px}
.pin-head p{color:var(--ink-soft)}
.pin-dots{display:flex;justify-content:center;gap:16px;margin:22px 0 6px}
.pin-dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);transition:background .15s}
.pin-dots i.on{background:var(--ink)}
.pin-dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pin-err{min-height:28px;color:#A3392A;font-weight:700}
.pin-pad{display:grid;grid-template-columns:repeat(3,80px);gap:14px;justify-content:center;margin-top:6px}
.pin-key{width:80px;height:80px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line);font-size:1.8rem;font-weight:700;display:grid;place-items:center;transition:transform .1s,background .1s}
.pin-key:active{transform:scale(.92);background:var(--surface-2)}
.pin-key.ghost{background:none;border:0;font-size:1rem;color:var(--ink-soft)}

/* تنبيه الخمول */
.idle{text-align:center}
.idle-ring{width:120px;height:120px;margin:0 auto 14px;position:relative;display:grid;place-items:center}
.idle-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.idle-ring circle{fill:none;stroke-width:6}
.idle-ring b{font-size:2.4rem;font-weight:800}
.idle h3{font-size:1.7rem}
.idle p{color:var(--ink-soft);margin:6px 0 18px}

/* الإشعار السريع */
#toast{position:fixed;left:50%;bottom:calc(110px + var(--safe-b));transform:translate(-50%,20px);z-index:120;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  background:var(--ink);color:var(--on-ink);padding:14px 24px;border-radius:999px;font-weight:700;box-shadow:0 16px 40px -14px rgba(0,0,0,.5);max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:#A3392A;color:#fff}

/* =====================================================================
   ١١) وضع التعديل
   ===================================================================== */
#admin{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;overscroll-behavior:contain}
.a-head{position:sticky;top:0;z-index:5;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(14px + var(--safe-t)) var(--gutter) 14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.a-title{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
.a-title .ic{width:30px;height:30px;color:var(--gold)}
.a-title h2{font-size:1.6rem}
.a-title small{color:var(--ink-soft)}
.tabs{display:flex;gap:6px;padding:6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);overflow-x:auto;max-width:100%}
.tab{min-height:52px;padding:0 20px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--ink-soft);white-space:nowrap;position:relative}
.tab .ic{width:21px;height:21px}
.tab.active{background:var(--ink);color:var(--on-ink)}
.tab .alert-dot{width:10px;height:10px;border-radius:50%;background:var(--terracotta);position:absolute;top:10px;left:12px}
.a-body{padding:24px var(--gutter) 60px;max-width:1200px;margin:0 auto}
.a-alert{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 20px;border-radius:var(--r-lg);background:rgba(181,96,63,.12);border:1px solid rgba(181,96,63,.3);margin-bottom:22px}
.a-alert .ic{color:var(--terracotta);width:30px;height:30px}
.a-alert div{flex:1;min-width:200px}
.a-alert b{display:block}
.a-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.a-toolbar .search{min-width:240px}
.a-stats{color:var(--ink-soft);margin-bottom:16px;display:flex;gap:16px;flex-wrap:wrap}
.a-list{display:grid;gap:12px}
.a-row{display:flex;align-items:center;gap:16px;padding:12px 16px 12px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.a-row.off{opacity:.62}
.a-row img{width:64px;aspect-ratio:3/4;object-fit:cover;border-radius:12px;flex:none;background:var(--surface-2)}
.a-row-info{flex:1;min-width:0}
.a-row-info b{font-family:var(--font-head);font-size:1.2rem;display:block}
.a-row-info small{color:var(--ink-soft);display:block;font-size:.92rem}
.a-row-actions{display:flex;align-items:center;gap:10px}
.a-row .switch-wrap small{color:var(--ink-soft);width:66px}
.card-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;margin-bottom:20px}
.card-block > h3{font-size:1.4rem;margin-bottom:4px}
.card-block > p.muted{margin-bottom:18px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:8px}
.field > span{font-weight:800;font-size:.95rem}
.field > span em{font-style:normal;color:var(--terracotta)}
.input{min-height:56px;padding:12px 18px;border-radius:var(--r-md);border:1.5px solid var(--line-strong);background:var(--bg);font-size:1.02rem;width:100%}
.input:focus{border-color:var(--caramel);box-shadow:0 0 0 4px rgba(192,138,91,.18)}
textarea.input{min-height:110px;resize:vertical;line-height:1.6}
.hint{font-size:.88rem;color:var(--ink-soft)}
.form-err{color:#A3392A;font-weight:700;min-height:24px}
.color-field{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 16px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--bg);min-height:64px}
.color-field input[type=color]{width:52px;height:46px;border:0;padding:0;background:none;border-radius:12px;overflow:hidden;flex:none}
.color-field input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.color-field input[type=color]::-webkit-color-swatch{border:1px solid rgba(0,0,0,.15);border-radius:12px}
.color-field div{flex:1}
.color-field b{display:block;font-size:.95rem}
.color-field code{font-size:.85rem;color:var(--ink-soft);direction:ltr;display:inline-block}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.preset{padding:12px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--bg);text-align:start;min-height:84px}
.preset[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.preset .strip{display:flex;height:26px;border-radius:8px;overflow:hidden;margin-bottom:8px}
.preset .strip i{flex:1}
.preset b{font-size:.95rem}
.font-chip{min-height:64px;padding:0 22px;font-size:1.25rem}
.logo-edit{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo-edit .logo{width:84px;height:84px}
.preview{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--bg);padding:18px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:stretch}
.preview .pv-banner{border-radius:var(--r-md);background:var(--ink);color:var(--on-ink);padding:20px;position:relative}
.preview .pv-banner::before{content:"";position:absolute;inset:7px;border:1px solid var(--gold);opacity:.45;border-radius:12px}
.preview .pv-banner h3{font-size:1.5rem;margin:4px 0}
.preview .pv-banner p{font-size:.9rem;opacity:.85}
.preview .pv-card{border-radius:var(--r-md);overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.preview .pv-card img{aspect-ratio:3/3.2;width:100%;object-fit:cover}
.preview .pv-card div{padding:8px 12px;font-weight:800}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px}
.kv dt{color:var(--ink-soft)}
.kv dd{margin:0;font-weight:700}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.danger-zone{border-color:rgba(163,57,42,.3)}

/* محرر العباية */
.ed-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 30px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.ed-head h2{font-size:1.7rem}
.ed-body{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:28px;padding:26px 30px}
.ed-media{display:flex;flex-direction:column;gap:12px}
.ed-img{position:relative;aspect-ratio:3/4;border-radius:var(--r-lg);overflow:hidden;background:var(--surface-2)}
.ed-img img{width:100%;height:100%;object-fit:cover}
.ed-img .busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.7);font-weight:800}
.ed-fields{display:flex;flex-direction:column;gap:18px}
.ed-foot{display:flex;gap:12px;justify-content:flex-end;padding:18px 30px 24px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.ed-foot .form-err{flex:1;align-self:center}

/* =====================================================================
   ١٢) التكيف مع المقاسات والاتجاهات
   ===================================================================== */
/* شاشة أفقية عريضة: الفلاتر تصير عمود جانبي ثابت */
@media (min-width:1024px) and (orientation:landscape){
  .home-layout{grid-template-columns:320px minmax(0,1fr)}
  .filters{
    position:sticky;top:calc(var(--topbar-h) + 18px);left:auto;right:auto;bottom:auto;z-index:1;transform:none;transition:none;
    max-height:calc(100vh - var(--topbar-h) - 140px);border-radius:var(--r-xl);border:1px solid var(--line);box-shadow:none;padding:20px 24px;
  }
  .filters::before,.fp-close,.fp-foot,.filter-btn,.fp-backdrop{display:none}
  .filters.flash{animation:flash 1s ease}
  .detail-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:44px;align-items:start}
  .detail-media{position:sticky;top:calc(var(--topbar-h) + 20px);max-height:calc(100vh - var(--topbar-h) - 190px);max-width:calc((100vh - var(--topbar-h) - 190px) * .75)}
}
@keyframes flash{30%{box-shadow:0 0 0 4px var(--gold)}}
@media (min-width:760px) and (orientation:portrait){
  .detail-media{max-height:52vh;max-width:calc(52vh * .75)}
}
@media (max-width:760px){
  .banner{grid-template-columns:1fr}
  .banner-arches{display:none}
  .req{grid-template-columns:1fr}
  .req-media img{max-height:38vh}
  .ed-body{grid-template-columns:1fr}
  .ed-media{max-width:280px;margin:0 auto;width:100%}
  .preview{grid-template-columns:1fr}
  .nav-btn{min-width:0;padding:0 18px}
  .a-row{flex-wrap:wrap}
  .a-row-actions{width:100%;justify-content:flex-end}
}
@media (max-width:520px){
  body{font-size:16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card-body{padding:10px 12px 14px}
  .card h3{font-size:1.05rem}
  .heart{width:48px;height:48px;top:8px;left:8px}
  .nav-btn span.lbl{display:none}
  .fav-thumb{width:96px}
  .pin-pad{grid-template-columns:repeat(3,72px)}
  .pin-key{width:72px;height:72px}
  .brand-tag{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<!-- شاشة البداية -->
<div id="splash" aria-hidden="true"><div class="logo" id="splashLogo"></div></div>

<!-- التطبيق -->
<header class="topbar" id="topbar">
  <button class="brand" id="brandBtn" data-act="home" aria-label="الرئيسية">
    <span class="logo-wrap"><span id="logoSlot"></span><svg class="press-ring" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="33"/></svg></span>
    <span><span class="brand-name" id="brandName"></span><span class="brand-tag" id="brandTag"></span></span>
  </button>
  <span class="top-pill" id="topPill"></span>
</header>

<main id="main">
  <section class="view home" id="view-home"></section>
  <section class="view" id="view-detail" hidden></section>
  <section class="view" id="view-favs" hidden></section>
</main>

<div class="fp-backdrop" id="fpBackdrop" data-act="close-filters"></div>
<nav class="bottom-nav" id="bottomNav" aria-label="التنقل"></nav>
<div id="admin" hidden></div>
<div id="modals"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:40px;text-align:center">هذا التطبيق يحتاج تفعيل JavaScript.</p></noscript>

<script>
(() => {
'use strict';

/* =====================================================================
   ١) الثوابت والإعدادات الافتراضية
   ===================================================================== */
const APP_VERSION = '1.0.0';
const KEYS = { settings: 'qaptan:settings', abayas: 'qaptan:abayas', meta: 'qaptan:meta' };
const LONG_PRESS_MS = 3000;            // مدة الضغطة الطويلة على الشعار لفتح وضع التعديل
const ADMIN_IDLE_MS = 5 * 60 * 1000;   // قفل وضع التعديل تلقائياً بعد ٥ دقائق خمول
const IDLE_WARN_SEC = 15;              // ثواني التنبيه قبل إعادة الضبط
const BACKUP_REMIND_DAYS = 7;          // التذكير بالتصدير كل أسبوع
const MAX_IMG_SIDE = 800;              // أقصى طول لضلع الصورة بعد الضغط
const PIN_MAX_TRIES = 5;

const COLORS = [
  { id: 'black',    name: 'أسود',     hex: '#17171A' },
  { id: 'navy',     name: 'كحلي',     hex: '#1E2840' },
  { id: 'beige',    name: 'بيج',      hex: '#D6C0A1' },
  { id: 'gray',     name: 'رمادي',    hex: '#85827E' },
  { id: 'olive',    name: 'زيتي',     hex: '#545A3A' },

function hashStr(s) { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h); }

/* توحيد النص العربي للبحث (الهمزات، التاء المربوطة، التشكيل، الأرقام الهندية) */
function norm(s) {
  return String(s || '').toLowerCase()
    .replace(/[ً-ٰٟـ]/g, '')
    .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .trim();
}
const parseNum = (v) => { const n = parseFloat(norm(v).replace(/[^\d.]/g, '')); return isFinite(n) ? n : NaN; };

function countLabel(n, f) {
  if (n === 0) return f.zero || `لا ${f.many}`;
  if (n === 1) return f.one;
  if (n === 2) return f.two;
  if (n <= 10) return `${n} ${f.few}`;
  return `${n} ${f.many}`;
}

/* أدوات الألوان */
function hexToRgb(h) {
  h = String(h || '#000').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16) || 0;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const rgbToHex = (rgb) => '#' + rgb.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = hexToRgb(a), B = hexToRgb(b); return rgbToHex(A.map((v, i) => v + (B[i] - v) * t)); };
const rgba = (h, a) => { const [r, g, b] = hexToRgb(h); return `rgba(${r},${g},${b},${a})`; };
function lum(h) {
  const [r, g, b] = hexToRgb(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
const isHex = (v) => /^#[0-9a-f]{6}$/i.test(String(v || ''));

   ٣) التخزين: localStorage للإعدادات + IndexedDB للصور (كله داخل try/catch)
   ===================================================================== */
const Store = {
  mem: {},   // بديل في الذاكرة إذا كان التخزين غير متاح (مثل التصفح الخاص)
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (raw == null) return key in this.mem ? clone(this.mem[key]) : fallback;
      return JSON.parse(raw);
    } catch (e) {
      return key in this.mem ? clone(this.mem[key]) : fallback;
    }
  },
  set(key, val) {
    this.mem[key] = clone(val);
    try { localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (e) { console.warn('تعذر الحفظ في localStorage', e); return false; }
  },
  remove(key) {
    delete this.mem[key];
    try { localStorage.removeItem(key); } catch (e) { /* تجاهل */ }
  },
};

const ImageDB = {
  db: null, failed: false, mem: new Map(),
  async open() {
    if (this.db || this.failed) return this.db;
    try {
      this.db = await new Promise((resolve, reject) => {
        const req = indexedDB.open('qaptan-images', 1);
        req.onupgradeneeded = () => { try { req.result.createObjectStore('images'); } catch (e) { /* موجودة */ } };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
        req.onblocked = () => reject(new Error('blocked'));
      });
    } catch (e) {
      console.warn('IndexedDB غير متاح، الصور ستبقى في الذاكرة فقط', e);
      this.failed = true; this.db = null;
    }
    return this.db;
  },
  _req(mode, fn) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction('images', mode);
      const r = fn(tx.objectStore('images'));
      tx.oncomplete = () => resolve(r && 'result' in r ? r.result : undefined);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('abort'));
    });
  },
  /* نخزن الصورة كـ ArrayBuffer + نوعها (أكثر توافقاً مع Safari من Blob مباشرة) */
  async put(id, blob) {
    this.mem.set(id, blob);
    try {
      if (!(await this.open())) return false;
      const buf = await blob.arrayBuffer();
      await this._req('readwrite', s => s.put({ type: blob.type || 'image/jpeg', buf }, id));
      return true;
    } catch (e) { console.warn('تعذر حفظ الصورة', e); return false; }
  },
  async get(id) {
    try {
      if (await this.open()) {
        const rec = await this._req('readonly', s => s.get(id));
        if (rec && rec.buf) return new Blob([rec.buf], { type: rec.type || 'image/jpeg' });
      }
    } catch (e) { console.warn('تعذر قراءة الصورة', e); }
    return this.mem.get(id) || null;
  },
  async del(id) {
    this.mem.delete(id);
    try { if (await this.open()) await this._req('readwrite', s => s.delete(id)); } catch (e) { /* تجاهل */ }
  },
  async keys() {
    try { if (await this.open()) return (await this._req('readonly', s => s.getAllKeys())) || []; } catch (e) { /* تجاهل */ }
    return Array.from(this.mem.keys());
  },
  async clear() {
    this.mem.clear();
    try { if (await this.open()) await this._req('readwrite', s => s.clear()); } catch (e) { /* تجاهل */ }
  },
};

  s.theme = Object.assign({ ...DEFAULT_THEME }, raw && raw.theme || {});
  for (const k of Object.keys(DEFAULT_THEME)) if (!isHex(s.theme[k])) s.theme[k] = DEFAULT_THEME[k];
  if (!HEAD_FONTS.some(f => f.id === s.headFont)) s.headFont = DEFAULT_SETTINGS.headFont;
  if (!BODY_FONTS.some(f => f.id === s.bodyFont)) s.bodyFont = DEFAULT_SETTINGS.bodyFont;
  s.pin = /^\d{4,8}$/.test(String(s.pin)) ? String(s.pin) : DEFAULT_SETTINGS.pin;
  s.idleMinutes = [1, 2, 3, 5].includes(Number(s.idleMinutes)) ? Number(s.idleMinutes) : 2;
  for (const k of ['shopName', 'tagline', 'welcomeTitle', 'welcomeText']) s[k] = String(s[k] == null ? '' : s[k]).slice(0, 300);
  if (!s.shopName.trim()) s.shopName = DEFAULT_SETTINGS.shopName;
  s.logo = typeof s.logo === 'string' ? s.logo : null;
  return s;
}

function normalizeAbaya(r) {
  if (!r || typeof r !== 'object') return null;
  const name = String(r.name || '').trim();
  if (!name) return null;
  const sizes = Array.isArray(r.sizes) ? [...new Set(r.sizes.map(Number).filter(n => n > 0 && n < 200))].sort((a, b) => a - b) : [];
  const colors = Array.isArray(r.colors) ? [...new Set(r.colors.filter(c => colorById(c)))] : [];
  return {
    id: String(r.id || uid()),
    code: String(r.code || '').trim().toUpperCase().slice(0, 30),
    name: name.slice(0, 120),
    price: Math.max(0, Number(r.price) || 0),
    fabric: String(r.fabric || '').trim().slice(0, 40),
    colors: colors.length ? colors : ['black'],
    sizes,
    desc: String(r.desc || '').slice(0, 1000),
    location: String(r.location || '').trim().slice(0, 80),
    available: r.available !== false,
    image: typeof r.image === 'string' ? r.image : null,
    demo: !!r.demo,
    createdAt: Number(r.createdAt) || Date.now(),
  };
}

function seedDemo() {

  }));
}

/* ضغط الصورة: تصغير لأطول ضلع ≈ 800px وتحويلها JPEG */
async function compressImage(file, maxSide = MAX_IMG_SIDE, type = 'image/jpeg', quality = 0.82) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error('decode'));
      i.src = url;
    });
    let w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) throw new Error('size');
    const s = Math.min(1, maxSide / Math.max(w, h));
    w = Math.max(1, Math.round(w * s)); h = Math.max(1, Math.round(h * s));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    if (type === 'image/jpeg') { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); }
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, w, h);
    const blob = await new Promise(res => c.toBlob(res, type, quality));
    if (!blob) throw new Error('encode');
    return blob;
  } finally { URL.revokeObjectURL(url); }
}
const blobToDataURL = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
function dataURLToBlob(du) {
  const m = /^data:([^;,]+)?(;base64)?,(.*)$/s.exec(String(du || ''));
  if (!m) return null;
  const type = m[1] || 'application/octet-stream';
  if (!m[2]) return new Blob([decodeURIComponent(m[3])], { type });
  const bin = atob(m[3]); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type });
}

let toastTimer = null;
function toast(msg, type = '') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = type; }, 2600);

const modals = [];
function openModal({ html, cls = '', dismiss = true, onClose = null, label = '', overlayCls = '' }) {
  const ov = document.createElement('div');
  ov.className = 'overlay ' + overlayCls;
  ov.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true" aria-label="${esc(label)}">${html}</div>`;
  $('#modals').appendChild(ov);
  const m = {
    el: ov, panel: ov.firstElementChild, onClose, closed: false,
    close(result) {
      if (m.closed) return;
      m.closed = true;
      const i = modals.indexOf(m); if (i >= 0) modals.splice(i, 1);
      ov.classList.remove('show');
      setTimeout(() => ov.remove(), 230);
      if (!modals.length) document.body.classList.remove('lock-scroll');
      if (m.onClose) m.onClose(result);
    },
  };
  if (dismiss) ov.addEventListener('click', e => { if (e.target === ov) m.close(); });
  modals.push(m);
  document.body.classList.add('lock-scroll');
  requestAnimationFrame(() => ov.classList.add('show'));
  return m;
}
const topModal = () => modals[modals.length - 1];
function closeAllModals() { while (modals.length) modals[modals.length - 1].close(); }

function confirmDialog({ title, text = '', ok = 'تأكيد', cancel = 'إلغاء', danger = false, icon = 'alert' }) {
  return new Promise(resolve => {
    let done = false;
    const m = openModal({
      cls: 'modal-sm confirm', label: title,
      html: `<div class="c-ic">${ic(icon)}</div><h3>${esc(title)}</h3><p>${esc(text)}</p>
        <div class="actions"><button class="btn btn-outline" data-r="no">${esc(cancel)}</button>
        <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-r="yes">${esc(ok)}</button></div>`,
      onClose: () => { if (!done) { done = true; resolve(false); } },
    });
    $('[data-r="no"]', m.panel).onclick = () => m.close();
    $('[data-r="yes"]', m.panel).onclick = () => { done = true; m.close(); resolve(true); };
  });
}

/* لوحة الرقم السري بأزرار كبيرة */
let pinTries = 0, pinLockUntil = 0;
function askPin() {
  return new Promise(resolve => {
    if (Date.now() < pinLockUntil) {
      toast(`محاولات كثيرة، حاولي بعد ${Math.ceil((pinLockUntil - Date.now()) / 1000)} ثانية`, 'err');
      return resolve(false);
    }
    const pin = state.settings.pin;
    let val = '', done = false;
    const keys = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="pin-key" data-k="${n}">${n}</button>`).join('');
    const m = openModal({
      cls: 'modal-sm pin', label: 'الرقم السري',
      html: `<div class="pin-head">${ic('lock')}<h3>وضع التعديل</h3><p>أدخلي الرقم السري</p></div>
        <div class="pin-dots" dir="ltr">${'<i></i>'.repeat(pin.length)}</div><p class="pin-err" aria-live="polite"></p>
        <div class="pin-pad" dir="ltr">${keys}<button class="pin-key ghost" data-k="cancel">إلغاء</button><button class="pin-key" data-k="0">0</button><button class="pin-key ghost" data-k="del" aria-label="مسح">${ic('backspace')}</button></div>`,
      onClose: () => { document.removeEventListener('keydown', onKey); if (!done) { done = true; resolve(false); } },
    });
    const dots = $('.pin-dots', m.panel), err = $('.pin-err', m.panel);
    const paint = () => $$('i', dots).forEach((d, i) => d.classList.toggle('on', i < val.length));
    const press = (k) => {
      if (k === 'cancel') return m.close();
      if (k === 'del') { val = val.slice(0, -1); return paint(); }
      if (val.length >= pin.length) return;
      val += k; paint();
      if (val.length === pin.length) {
        if (val === pin) { pinTries = 0; done = true; m.close(); resolve(true); }
        else {
          pinTries++;
          dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
          if (pinTries >= PIN_MAX_TRIES) {
            pinLockUntil = Date.now() + 30000; pinTries = 0;
            toast('محاولات كثيرة، تم القفل ٣٠ ثانية', 'err');
            setTimeout(() => m.close(), 400);
          } else err.textContent = `الرقم غير صحيح (${PIN_MAX_TRIES - pinTries} محاولات متبقية)`;
          setTimeout(() => { val = ''; paint(); }, 350);
        }
      }
    };
    const onKey = (e) => {
      if (/^\d$/.test(e.key)) press(e.key);
      else if (e.key === 'Backspace') press('del');
    };
    document.addEventListener('keydown', onKey);
    $('.pin-pad', m.panel).addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
  });
}

/* =====================================================================
   ٨) واجهة الزبونة: الكتالوج والفلاتر
   ===================================================================== */
const catalog = () => state.abayas.filter(a => a.available);

function refreshFacets() {
  const list = catalog();
  const colors = new Map(), fabrics = new Map(), sizes = new Map();
  let lo = Infinity, hi = -Infinity;
  for (const a of list) {
    a.colors.forEach(c => colors.set(c, (colors.get(c) || 0) + 1));
    if (a.fabric) fabrics.set(a.fabric, (fabrics.get(a.fabric) || 0) + 1);
    a.sizes.forEach(s => sizes.set(s, (sizes.get(s) || 0) + 1));
    lo = Math.min(lo, a.price); hi = Math.max(hi, a.price);
  }
  if (!list.length) { lo = 0; hi = 0; }
  lo = Math.floor(lo / 10) * 10; hi = Math.ceil(hi / 10) * 10;
  if (hi <= lo) hi = lo + 10;
  const fabOrder = (x) => { const i = FABRICS.indexOf(x); return i < 0 ? 99 : i; };
  state.fx = {
    colors: COLORS.filter(c => colors.has(c.id)).map(c => ({ ...c, n: colors.get(c.id) })),
    fabrics: [...fabrics.entries()].sort((a, b) => fabOrder(a[0]) - fabOrder(b[0]) || a[0].localeCompare(b[0], 'ar')).map(([name, n]) => ({ name, n })),
    sizes: [...sizes.entries()].sort((a, b) => a[0] - b[0]).map(([v, n]) => ({ v, n })),
    lo, hi,
  };
  // تنظيف فلاتر لم تعد موجودة
  const f = state.f;
  for (const c of [...f.colors]) if (!colors.has(c)) f.colors.delete(c);
  for (const x of [...f.fabrics]) if (!fabrics.has(x)) f.fabrics.delete(x);
  for (const s of [...f.sizes]) if (!sizes.has(s)) f.sizes.delete(s);
  if (f.pmin != null && (f.pmin <= lo || f.pmin >= hi)) f.pmin = null;
  if (f.pmax != null && (f.pmax >= hi || f.pmax <= lo)) f.pmax = null;
}

const priceActive = () => state.f.pmin != null || state.f.pmax != null;
const activeFilterCount = () => state.f.colors.size + state.f.fabrics.size + state.f.sizes.size + (priceActive() ? 1 : 0);
const isFiltering = () => activeFilterCount() > 0 || !!state.search.trim();

function searchText(a) {
  return norm([a.name, a.code, a.fabric, a.desc, ...a.colors.map(colorName), ...a.sizes].join(' '));
}
function results() {
  const f = state.f;
  const tokens = norm(state.search).split(/\s+/).filter(Boolean);
  const out = catalog().filter(a => {
    if (f.colors.size && !a.colors.some(c => f.colors.has(c))) return false;
    if (f.fabrics.size && !f.fabrics.has(a.fabric)) return false;
    if (f.sizes.size && !a.sizes.some(s => f.sizes.has(s))) return false;
    if (f.pmin != null && a.price < f.pmin) return false;
    if (f.pmax != null && a.price > f.pmax) return false;
    if (tokens.length) { const hay = searchText(a); if (!tokens.every(t => hay.includes(t))) return false; }
    return true;
  });
  if (state.sort === 'priceAsc') out.sort((a, b) => a.price - b.price);
  else if (state.sort === 'priceDesc') out.sort((a, b) => b.price - a.price);
  return out;
}

        <input type="range" id="rMax" min="${lo}" max="${hi}" step="${step}" value="${f.pmax ?? hi}" aria-label="أعلى سعر">
      </div>
      <div class="range-vals"><span>من <b id="rMinLbl">${fmtNum(f.pmin ?? lo)}</b></span><span>إلى <b id="rMaxLbl">${fmtNum(f.pmax ?? hi)}</b> ر.س</span></div>

      <button class="btn btn-outline" data-act="clear-filters">مسح الفلاتر</button>
      <button class="btn btn-primary" data-act="close-filters">عرض <span class="js-count">0</span><span class="js-count-lbl">نتيجة</span></button>
    </div>`;
  const rMin = $('#rMin'), rMax = $('#rMax');
  const onRange = (which) => {
    let a = Number(rMin.value), b = Number(rMax.value);
    if (a > b - step) { if (which === 'min') { a = b - step; rMin.value = a; } else { b = a + step; rMax.value = b; } }
    state.f.pmin = a <= fx.lo ? null : a;
    state.f.pmax = b >= fx.hi ? null : b;
    paintRange();
    updateResultsSoon();
  };
  rMin.addEventListener('input', () => onRange('min'));
  rMax.addEventListener('input', () => onRange('max'));
  paintRange();
}

function paintRange() {
  const rMin = $('#rMin'), rMax = $('#rMax'), fill = $('#rangeFill');
  if (!rMin || !fill) return;
  const lo = Number(rMin.min), hi = Number(rMin.max), span = hi - lo || 1;
  const a = (Number(rMin.value) - lo) / span, b = (Number(rMax.value) - lo) / span;
  fill.style.left = `calc(20px + (100% - 40px) * ${a})`;
  fill.style.width = `calc((100% - 40px) * ${Math.max(0, b - a)})`;
  rMin.style.zIndex = a > 0.9 ? 3 : 2; rMax.style.zIndex = a > 0.9 ? 2 : 3;
  $('#rMinLbl').textContent = fmtNum(rMin.value);
  $('#rMaxLbl').textContent = fmtNum(rMax.value);
}

function syncFilterUI() {
  const f = state.f;
  $$('#filtersPanel [data-act="toggle-filter"]').forEach(b => {
    const g = b.dataset.group, v = g === 'sizes' ? Number(b.dataset.value) : b.dataset.value;
    b.setAttribute('aria-pressed', String(f[g].has(v)));
  });
  const rMin = $('#rMin'), rMax = $('#rMax');
  if (rMin) { rMin.value = f.pmin ?? state.fx.lo; rMax.value = f.pmax ?? state.fx.hi; paintRange(); }
}

function updateResults() {
  const grid = $('#grid');
  if (!grid) return;
  const list = results(), total = catalog().length, n = activeFilterCount();
  $('#view-home').classList.toggle('filtering', isFiltering());

  // العنوان والعدّاد
  $('#resTitle').textContent = isFiltering() ? 'نتائج البحث' : 'كل العبايات';
  $('#resSub').textContent = total ? (isFiltering() ? `${countLabel(list.length, ABAYA_FORMS)} من أصل ${total}` : countLabel(total, ABAYA_FORMS)) : '';
  $$('.js-count').forEach(el => el.textContent = list.length);
  $$('.js-count-lbl').forEach(el => el.textContent = list.length === 1 ? 'نتيجة' : (list.length === 2 ? 'نتيجتين' : (list.length <= 10 && list.length > 0 ? 'نتائج' : 'نتيجة')));
  const badge = $('#filterBadge');
  if (badge) { badge.textContent = n; badge.hidden = !n; }
  $$('.sort [data-sort]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sort === state.sort)));
  const clr = $('.s-clear'); if (clr) clr.hidden = !state.search;

  // الفلاتر النشطة كشرائح قابلة للإزالة
  const f = state.f, chips = [];
  f.colors.forEach(c => chips.push(['colors', c, colorName(c)]));
  f.fabrics.forEach(x => chips.push(['fabrics', x, x]));
  [...f.sizes].sort((a, b) => a - b).forEach(s => chips.push(['sizes', s, `مقاس ${s}`]));
  if (priceActive()) chips.push(['price', '', `${fmtNum(f.pmin ?? state.fx.lo)} – ${fmtNum(f.pmax ?? state.fx.hi)} ر.س`]);
  $('#activeRow').innerHTML = chips.map(([g, v, l]) => `<button class="chip chip-x" aria-pressed="true" data-act="remove-filter" data-group="${g}" data-value="${esc(v)}">${esc(l)} ${ic('x')}</button>`).join('')
    + (chips.length > 1 ? `<button class="link-btn" data-act="clear-filters">مسح الكل</button>` : '');

  // الشبكة أو الحالات الفارغة
  if (!total) {
    grid.innerHTML = `<div class="empty">${EMPTY_ART.hanger}<h3>الكتالوج فاضي حالياً</h3><p>ما فيه عبايات معروضة الحين. اسألي الموظفة وبتساعدك بكل سرور.</p></div>`;
  } else if (!list.length) {
    const q = state.search.trim();
    grid.innerHTML = `<div class="empty">${EMPTY_ART.search}<h3>ما لقينا عبايات بهذي الاختيارات</h3>
      <p>${q ? `ما فيه نتائج لكلمة «${esc(q)}»${n ? ' مع الفلاتر المختارة' : ''}.` : 'ما فيه عباية تطابق كل الفلاتر المختارة.'} جرّبي تخففين الفلاتر أو تبحثين بكلمة ثانية.</p>
      <div class="empty-actions">${n ? '<button class="btn btn-primary" data-act="clear-filters">مسح الفلاتر</button>' : ''}${q ? '<button class="btn btn-outline" data-act="clear-search">مسح البحث</button>' : ''}</div></div>`;
  } else {
    grid.innerHTML = list.map(cardHTML).join('');
  }
  renderNav();
}
const updateResultsSoon = (() => { let raf = 0; return () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(updateResults); }; })();

function toggleFilter(group, value) {
  const set = state.f[group];
  const v = group === 'sizes' ? Number(value) : value;
  set.has(v) ? set.delete(v) : set.add(v);
  syncFilterUI(); updateResults();
}
function removeFilter(group, value) {
  if (group === 'price') { state.f.pmin = state.f.pmax = null; }
  else state.f[group].delete(group === 'sizes' ? Number(value) : value);
  syncFilterUI(); updateResults();
}
function clearFilters() {
  const f = state.f;
  f.colors.clear(); f.fabrics.clear(); f.sizes.clear(); f.pmin = f.pmax = null;
  syncFilterUI(); updateResults();
}

const wideLayout = () => window.matchMedia('(min-width:1024px) and (orientation:landscape)').matches;

function closeFilters() {
  if (!state.sheetOpen) return;

}

function renderNav(bump = false) {

    <button class="nav-btn ${active === 'favs' ? 'active' : ''} ${bump ? 'bump' : ''}" data-act="favs">${ic('heart')}<span class="lbl">المفضلة</span>${nf ? `<span class="count-badge">${nf}</span>` : ''}</button>`;
}

function showView(view, scroll = 0) {
  state.view = view;
  ['home', 'detail', 'favs'].forEach(v => { $('#view-' + v).hidden = v !== view; });
  if (view === 'detail') renderDetail();
  if (view === 'favs') renderFavs();
  if (view === 'home') updateResults();
  renderNav();
  requestAnimationFrame(() => window.scrollTo(0, scroll));
}

function navigate(view, id = null) {
  closeFilters();
  if (state.view === view && state.currentId === id && view !== 'detail') return;
  state.stack.push({ view: state.view, id: state.currentId, sel: { ...state.sel }, scroll: window.scrollY });
  try { history.pushState({ q: state.stack.length }, ''); } catch (e) { /* تجاهل */ }
  if (view === 'detail') {
    const a = state.abayas.find(x => x.id === id);
    const fe = favEntry(id);
    state.currentId = id;
    state.sel = { size: fe ? fe.size : null, color: fe && fe.color ? fe.color : (a ? a.colors[0] : null) };
  }
  showView(view, 0);
}

function internalBack() {
  closeAllModals(); closeFilters();
  const prev = state.stack.pop();
  if (!prev) { state.currentId = null; return showView('home', 0); }
  state.currentId = prev.id;
  if (prev.sel) state.sel = prev.sel;
  showView(prev.view, prev.scroll);
}
let backPending = false;
function goBack() {
  if (!state.stack.length) return showView('home', 0);
  backPending = true;
  try { history.back(); } catch (e) { /* تجاهل */ }
  setTimeout(() => { if (backPending) { backPending = false; internalBack(); } }, 350);
}
window.addEventListener('popstate', () => {
  backPending = false;
  if (adminOpen()) { try { history.pushState({ q: 'admin' }, ''); } catch (e) { /* تجاهل */ } return; }
  if (modals.length) { closeAllModals(); try { history.pushState({ q: 'm' }, ''); } catch (e) { /* تجاهل */ } return; }
  internalBack();
});

function navigateHome() {
  closeFilters();
  const n = state.stack.length;
  state.stack = []; state.currentId = null;
  if (n) { try { history.go(-n); } catch (e) { /* تجاهل */ } }
  backPending = false;
  if (state.view !== 'home') showView('home', 0);
  else window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =====================================================================
   ١٠) إعادة الضبط التلقائية بعد الخمول (الشاشة مشتركة بين الزبونات)
   ===================================================================== */
let lastActivity = Date.now(), idleModal = null;
function markActivity() {
  lastActivity = Date.now();
  if (idleModal) { const m = idleModal; idleModal = null; m.close(); }
}
const isDirty = () => state.view !== 'home' || state.favs.length > 0 || isFiltering() || state.sort !== 'default' || modals.length > 0 || state.sheetOpen;

function resetSession() {
  idleModal = null;
  closeAllModals(); closeFilters();
  state.favs = []; state.search = ''; state.sort = 'default';
  state.sel = { size: null, color: null };
  const f = state.f; f.colors.clear(); f.fabrics.clear(); f.sizes.clear(); f.pmin = f.pmax = null;
  navigateHome();
  const inp = $('#searchInput'); if (inp) { inp.value = ''; inp.blur(); }
  syncFilterUI(); updateResults();
  window.scrollTo(0, 0);
  lastActivity = Date.now();
}

function idleTick() {
  const idle = Date.now() - lastActivity;
  if (adminOpen()) {
    if (idle > ADMIN_IDLE_MS) { closeAdmin(); resetSession(); toast('تم قفل وضع التعديل تلقائياً'); }
    return;
  }
  const limit = state.settings.idleMinutes * 60000;
  if (!isDirty()) {
    if (idle > limit && window.scrollY > 0) { window.scrollTo({ top: 0, behavior: 'smooth' }); lastActivity = Date.now(); }
    return;
  }
  if (idle >= limit) { resetSession(); return; }
  const left = Math.ceil((limit - idle) / 1000);
  if (left <= IDLE_WARN_SEC) {
    if (!idleModal) {
      idleModal = openModal({
        cls: 'modal-sm idle', dismiss: false, label: 'هل ما زلتِ هنا؟',
        html: `<div class="idle-ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" style="stroke:var(--line)"/><circle class="idle-prog" cx="60" cy="60" r="54" style="stroke:var(--terracotta)" stroke-dasharray="339.3" stroke-dashoffset="0" stroke-linecap="round"/></svg><b class="idle-n">${left}</b></div>
          <h3>هل ما زلتِ تتصفحين؟</h3><p>بنرجع للصفحة الرئيسية ونفضّي المفضلة بعد لحظات عشان الزبونة الجاية.</p>
          <button class="btn btn-primary btn-lg btn-block">${ic('check')} إيه، أكمل التصفح</button>`,
      });
    }
    $('.idle-n', idleModal.panel).textContent = left;
    $('.idle-prog', idleModal.panel).setAttribute('stroke-dashoffset', String(339.3 * (1 - left / IDLE_WARN_SEC)));
  }
}

  });
  const P = m.panel;
  const paintImg = () => {
    const img = $('#edImg', P);
    if (ed.previewURL) img.src = ed.previewURL;
    else if (!ed.removeImage && d.image && imgURLs.get(d.image)) img.src = imgURLs.get(d.image);
    else img.src = placeholderFor({ ...d, id: d.id });
    $('#edRm', P).hidden = !(ed.previewURL || (!ed.removeImage && d.image));
  };
  paintImg();
  P.addEventListener('input', () => { ed.dirty = true; $('#edErr', P).textContent = ''; });

  $('#edFile', P).addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (!/^image\//.test(file.type || 'image/')) { toast('الملف المختار ليس صورة', 'err'); return; }
    ed.busy = true; $('#edBusy', P).hidden = false;
    try {
      const blob = await compressImage(file);
      if (ed.previewURL) URL.revokeObjectURL(ed.previewURL);
      ed.blob = blob; ed.previewURL = URL.createObjectURL(blob); ed.removeImage = false; ed.dirty = true;
      $('#edImgInfo', P).textContent = `تم ضغط الصورة: ${Math.round(file.size / 1024)} ك.ب ← ${Math.round(blob.size / 1024)} ك.ب`;
      paintImg();
    } catch (err) {
      toast('تعذّرت قراءة الصورة، جرّبي صورة ثانية (JPG أو PNG)', 'err');
    } finally { ed.busy = false; $('#edBusy', P).hidden = true; }
  });

  const close = () => { if (ed.previewURL) URL.revokeObjectURL(ed.previewURL); m.close(); };

  P.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-r]'); if (!b) return;
    const r = b.dataset.r;
    if (r === 'color' || r === 'size') {
      const on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', String(on)); ed.dirty = true;
      if (r === 'color') {
        const v = b.dataset.v;
        d.colors = on ? [...d.colors.filter(c => c !== v), v] : d.colors.filter(c => c !== v);
        if (!ed.previewURL && (ed.removeImage || !d.image)) paintImg();
      } else {
        const v = Number(b.dataset.v);
        d.sizes = on ? [...new Set([...d.sizes, v])].sort((x, y) => x - y) : d.sizes.filter(s => s !== v);
      }
    } else if (r === 'allsizes') {
      d.sizes = [...SIZES]; ed.dirty = true;
      $$('#edSizes [data-r="size"]', P).forEach(x => x.setAttribute('aria-pressed', 'true'));
    } else if (r === 'avail') {
      d.available = b.getAttribute('aria-checked') !== 'true';
      b.setAttribute('aria-checked', String(d.available)); ed.dirty = true;
    } else if (r === 'rmimg') {
      if (ed.previewURL) { URL.revokeObjectURL(ed.previewURL); ed.previewURL = null; ed.blob = null; }
      ed.removeImage = true; ed.dirty = true; paintImg();
    } else if (r === 'cancel') {
      if (!ed.dirty || await confirmDialog({ title: 'تجاهل التغييرات؟', text: 'ما راح تنحفظ التعديلات اللي سويتيها.', ok: 'تجاهل', cancel: 'رجوع للتعديل' })) close();
    } else if (r === 'save') {
      if (ed.busy) return;
      await saveEditor();

  async function saveEditor() {
    const err = (msg, el) => { $('#edErr', P).textContent = msg; if (el) el.focus(); };
    const name = $('#edName', P).value.trim();
    const code = $('#edCode', P).value.trim().toUpperCase();
    const price = parseNum($('#edPrice', P).value);
    if (!name) return err('اكتبي اسم العباية', $('#edName', P));
    if (!code) return err('اكتبي كود العباية', $('#edCode', P));
    if (state.abayas.some(x => x.id !== d.id && (x.code || '').toUpperCase() === code)) return err(`الكود ${code} مستخدم لعباية ثانية`, $('#edCode', P));
    if (!(price > 0)) return err('اكتبي سعر صحيح بالأرقام', $('#edPrice', P));
    if (!d.colors.length) return err('اختاري لون واحد على الأقل');
    if (!d.sizes.length) return err('اختاري مقاس واحد على الأقل');
    Object.assign(d, {
      name, code, price, fabric: $('#edFabric', P).value.trim(), location: $('#edLoc', P).value.trim(),
      desc: $('#edDesc', P).value.trim(),
    });
    const oldImage = orig ? orig.image : null;
    if (ed.blob) {
      const imgId = 'img-' + uid();
      const ok = await ImageDB.put(imgId, ed.blob);
      if (!ok) toast('تنبيه: التخزين غير متاح، الصورة بتنحفظ مؤقتاً فقط', 'err');
      setImageURL(imgId, ed.blob);
      d.image = imgId;
      if (oldImage) { await ImageDB.del(oldImage); dropImageURL(oldImage); }
    } else if (ed.removeImage && oldImage) {
      await ImageDB.del(oldImage); dropImageURL(oldImage); d.image = null;
    }
    const clean = normalizeAbaya({ ...d, demo: false });   // أي عباية تُحفظ من المحرر تصير من بيانات المحل
    if (orig) state.abayas[state.abayas.findIndex(x => x.id === orig.id)] = clean;
    else state.abayas.unshift(clean);
    saveAbayas(); markChanged(); requestPersistentStorage();
    refreshFacets();
    close();
    renderAdminTab();
    toast(orig ? 'تم حفظ التعديلات' : 'تمت إضافة العباية');
  }
}

function setByPath(obj, path, value) {

  while (parts.length > 1) o = o[parts.shift()];
  o[parts[0]] = value;
}
function onBind(el) {

async function buildBackup() {
  const images = {};
  const ids = state.abayas.map(a => a.image).filter(Boolean);
  if (state.settings.logo) ids.push(state.settings.logo);
  for (const id of ids) {
    const blob = await ImageDB.get(id);
    if (blob) images[id] = await blobToDataURL(blob);
  }
  return { app: 'qaptan', format: 1, version: APP_VERSION, exportedAt: new Date().toISOString(), settings: state.settings, abayas: state.abayas, images };
}
function backupFileName() { return `qaptan-backup-${new Date().toISOString().slice(0, 10)}.json`; }

async function exportBackup(share = false) {
  toast('جارٍ تجهيز الملف…');
  try {
    const data = await buildBackup();
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const name = backupFileName();
    if (share) {
      const file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'نسخة احتياطية — قبطان' });
      } else throw new Error('share-unsupported');
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
    state.meta.lastExportAt = Date.now(); saveMeta();
    renderAdmin();
    toast(`تم التصدير (${Math.max(1, Math.round(blob.size / 1024))} ك.ب)`);
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    console.error(e);
    toast(e && e.message === 'share-unsupported' ? 'المشاركة غير مدعومة، استخدمي زر التصدير' : 'تعذّر التصدير', 'err');
  }
}

async function importBackup(file) {
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); }
  catch (e) { return toast('الملف غير صالح أو تالف', 'err'); }
  if (!data || data.app !== 'qaptan' || !Array.isArray(data.abayas)) return toast('هذا الملف ليس نسخة احتياطية من قبطان', 'err');
  const abayas = data.abayas.map(normalizeAbaya).filter(Boolean);
  const ok = await confirmDialog({
    title: 'استيراد النسخة؟',
    text: `فيها ${countLabel(abayas.length, ABAYA_FORMS)}${data.exportedAt ? ` (بتاريخ ${fmtDate(data.exportedAt)})` : ''}. بتنحذف كل البيانات الحالية وتنستبدل بها.`,
    ok: 'استيراد واستبدال', danger: true, icon: 'upload',
  });
  if (!ok) return;
  toast('جارٍ الاستيراد…');
  try {
    const images = data.images && typeof data.images === 'object' ? data.images : {};
    await ImageDB.clear(); clearImageURLs();
    for (const [id, du] of Object.entries(images)) {
      const blob = dataURLToBlob(du);
      if (blob) { await ImageDB.put(id, blob); setImageURL(id, blob); }
    }
    for (const a of abayas) if (a.image && !imgURLs.has(a.image)) a.image = null;
    state.abayas = abayas;
    state.settings = normalizeSettings(data.settings);
    if (state.settings.logo && !imgURLs.has(state.settings.logo)) state.settings.logo = null;
    state.favs = [];
    saveAbayas(); saveSettings();
    state.meta.changedAt = Date.now(); state.meta.lastExportAt = Date.now(); saveMeta();
    applyTheme(); applyFonts();
    refreshFacets(); refreshCustomer();
    renderAdmin();
    toast('تم الاستيراد بنجاح');
  } catch (e) {
    console.error(e);
    toast('صار خطأ أثناء الاستيراد', 'err');
  }
}
